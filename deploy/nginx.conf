# Balanceador de carga delante de las réplicas de la API (servicio "api" de docker-compose.yml).
# El DNS interno de Docker devuelve una IP por réplica; nginx las reparte en round-robin.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 8080;
    server_tokens off;

    # La API recibe fotos en base64 (hasta 15 MB de JSON): el límite por defecto de nginx (1 MB) las rechazaría.
    client_max_body_size 16m;

    # Cabeceras de seguridad HTTP.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Healthcheck del propio balanceador (no depende de la API).
    location = /lb-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        # Con variable, nginx vuelve a resolver "api" cada 5 s: sigue el ritmo de réplicas que nacen o mueren.
        set $upstream http://api:3001;
        proxy_pass $upstream;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Si una réplica falla, reintenta con otra en lugar de devolver el error al cliente.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }
}
