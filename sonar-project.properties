# Configuración de SonarCloud. Reemplaza los dos valores marcados con los de tu cuenta
# (SonarCloud -> tu organización -> Projects -> Information).
sonar.organization=REEMPLAZA_CON_TU_ORGANIZACION
sonar.projectKey=REEMPLAZA_CON_TU_ORGANIZACION_storego
sonar.projectName=StoreGo

sonar.sources=server,src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.js
sonar.exclusions=**/node_modules/**,dist/**,coverage/**,src/lib/regiones.js,src/styles/**
sonar.sourceEncoding=UTF-8

# Cobertura: Vitest (provider v8) genera LCOV. Es el equivalente en JavaScript de lo que JaCoCo hace en Java.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# El job de CI falla si el Quality Gate no se cumple.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
