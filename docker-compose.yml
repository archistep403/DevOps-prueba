# Orquestación de StoreGo con Docker Compose.
#
#   cp .env.docker.example .env.docker      # edita contraseñas
#   docker compose --env-file .env.docker up -d --build --wait
#   curl http://localhost:8080/api/health
#
#   [cliente] -> lb (nginx :8080) -> api x N réplicas (Express :3001) -> db (MySQL 8.4)
#
# Escalar: STOREGO_REPLICAS=4 en .env.docker, o `docker compose up -d --scale api=4 --no-recreate`.

name: storego

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

services:
  db:
    <<: *hardening
    image: mysql:8.4
    # --max_allowed_packet: las fotos del panel (hasta 15 MB de JSON) se guardan en MySQL.
    command: ["--max_allowed_packet=16M", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: storego
      MYSQL_USER: storego
      MYSQL_PASSWORD: ${STOREGO_DB_PASSWORD:?Define STOREGO_DB_PASSWORD en .env.docker}
    volumes:
      - db_data:/var/lib/mysql
    # El entrypoint de MySQL necesita estas capacidades para cambiar de usuario al arrancar.
    cap_add: [CHOWN, SETGID, SETUID, DAC_OVERRIDE, FOWNER]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u storego -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 512M }

  # Tarea de un solo uso: crea tablas y datos iniciales (idempotente) antes de levantar la API.
  db-init:
    image: ${STOREGO_IMAGE:-storego:local}
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-local}
        VERSION: ${VERSION:-local}
    command: ["node", "server/init-db.js"]
    environment: &api-env
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: storego
      DB_PASSWORD: ${STOREGO_DB_PASSWORD:?Define STOREGO_DB_PASSWORD en .env.docker}
      DB_NAME: storego
      JWT_SECRET: ${STOREGO_JWT_SECRET:?Define STOREGO_JWT_SECRET en .env.docker}
    depends_on:
      db: { condition: service_healthy }
    networks: [backend]
    restart: "no"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  api:
    <<: *hardening
    image: ${STOREGO_IMAGE:-storego:local}
    environment:
      <<: *api-env
      TRUST_PROXY: "1" # una capa de proxy (lb): el rate-limit del login ve la IP real del cliente
    depends_on:
      db-init: { condition: service_completed_successfully }
    networks: [backend]
    read_only: true
    tmpfs: ["/tmp"]
    # Sin container_name ni ports: así se puede escalar. Solo el balanceador se expone.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/api/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    deploy:
      replicas: ${STOREGO_REPLICAS:-2}
      resources:
        limits: { cpus: "0.50", memory: 256M }
        reservations: { cpus: "0.10", memory: 64M }

  lb:
    <<: *hardening
    image: nginxinc/nginx-unprivileged:1.27-alpine
    ports:
      - "${STOREGO_PORT:-8080}:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api: { condition: service_healthy }
    networks: [backend]
    read_only: true
    tmpfs: ["/tmp"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/lb-health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 64M }

networks:
  backend:

volumes:
  db_data:
